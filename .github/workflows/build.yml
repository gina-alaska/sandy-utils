
name: Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
      volumes:
        - ${{ github.workspace }}:/build
    steps:
      - name: setup
        id: setup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "default:"
          dnf update -y 
          dnf install -y wget bzip2 xz make
          dnf group install -y "Development Tools"
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager -y --add-repo https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install -y git
          dnf install -y gh --repo gh-cli
          
      - uses: actions/checkout@v7

      - name: build
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory /__w/sandy-utils/sandy-utils
          git status
          ./build.bash
          export SAFE_REF="${GITHUB_REF_NAME//\//-}"
          export FULL_RELEASE_NAME="sandy-utils-${SAFE_REF}.$(date +%Y%m%d)"
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" \
           --title "${{ github.ref_name }}" \
           --notes "Automated release for ${{ github.ref_name }}" \
           --target "${{ github.sha }}"
          tar --bzip2 -cvf "/tmp/${FULL_RELEASE_NAME}.tar.bz2" .
          gh release upload "${{ github.ref_name }}" "/tmp/${FULL_RELEASE_NAME}.tar.bz2"

