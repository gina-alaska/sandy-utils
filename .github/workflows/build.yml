
name: Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export SAFE_REF="${GITHUB_REF_NAME//\//-}"
          export FULL_RELEASE_NAME="sandy-utils-${SAFE_REF}.$(date +%Y%m%d)"
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" \
           --title "${{ github.ref_name }}" \
           --notes "Automated release for ${{ github.ref_name }}" \
           --target "${{ github.sha }}"
          tar --bzip2 -cvf "/tmp/${FULL_RELEASE_NAME}.tar.bz2" .
          gh release upload "${{ github.ref_name }}" "/tmp/${FULL_RELEASE_NAME}.tar.bz2"

