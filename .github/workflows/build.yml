# Reusable workflow for building artifacts
name: Build

on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get current date
        id: date
        run: |
          echo "{date}={$(date +'%Y%m%d')}" >> $GITHUB_STATE
      - name: Test with environment variables
        run: tar --bzip2 -cvf /tmp/$RELEASE_NAME.tar.bz2 *
        env:
          RELEASE_NAME: sandy-utils-${{ github.ref_name }}-${{ env.date }}
      - name: release
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: /tmp/$RELEASE_NAME.tar.bz2
         env:
          RELEASE_NAME: sandy-utils-${{ github.ref_name }}-${{ env.date }}
