
name: Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release
        id: release
        shell: bash
        env:
          RELEASE_NAME: sandy-utils-${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_NAME_FULL="${RELEASE_NAME}.$(date +%Y%m%d)"
          tar --bzip2 -cvf "/tmp/${RELEASE_NAME_FULL}.tar.bz2" .
          gh release upload "${{ github.ref_name }}" "/tmp/${RELEASE_NAME_FULL}.tar.bz2"
