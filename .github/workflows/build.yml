
name: Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get current date
        id: date
        shell: bash
        run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: Release
        env:
          RELEASE_NAME: sandy-utils-${{ github.ref_name }}-${{ env.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tar --bzip2 -cvf "/tmp/${RELEASE_NAME}.tar.bz2" .
          gh release upload "${{ github.ref_name }}" "/tmp/${{ env.RELEASE_NAME }}.tar.bz2"
